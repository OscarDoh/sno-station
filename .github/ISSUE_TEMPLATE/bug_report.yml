name: Bug report
description: Something in Sno Station does not do what the README says it does.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks. Please do not paste credentials, private host names, or memory contents you would not want public.
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Codex
        - OpenClaw
        - More than one
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sno --version`, or the commit hash if you run from source.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste error text as text, not as a screenshot.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact anything private. Logs never contain memory contents by default; check before pasting.
      render: text
