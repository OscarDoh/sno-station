name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chunking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/chunking/package-lock.json
      - run: npm ci --prefix packages/chunking
      - run: npm run build --prefix packages/chunking
