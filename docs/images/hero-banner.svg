<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">Two forms merge before dawn</title>
  <desc id="description">Two luminous spheres begin to merge above a shared workspace plane.</desc>
  <defs>
    <linearGradient id="text-field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111d" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#08111d" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#05070c" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <image href="hero-art.png" x="0" y="0" width="1600" height="480" preserveAspectRatio="none"/>
  <rect x="620" y="0" width="980" height="480" fill="url(#text-field)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="712" y="88" fill="#2dd4bf" font-size="17" font-weight="700" letter-spacing="5.5">SNO STATION</text>
    <text x="708" y="196" fill="#ffffff" font-size="90" font-weight="700" letter-spacing="-2.6">Agents, assemble.</text>
    <text x="712" y="263" fill="#e6edf3" font-size="30" font-weight="400" letter-spacing="-0.25">Two heads are better than one, and smarter by morning.</text>
    <text x="712" y="316" fill="#b6c2d1" font-size="22" font-weight="500" letter-spacing="0">One shared memory. Cross-agent-harness review. Recursive self-improvement, nightly.</text>
  </g>
</svg>
