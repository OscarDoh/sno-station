<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">Memora weekly-track recall after the forgetting penalty</title>
  <desc id="description">Directional comparison of Sno Station with six published agents, including the points each loses to stale facts.</desc>
  <image href="memora-forgetting-cost-art.png" x="0" y="0" width="1600" height="720" preserveAspectRatio="none"/>
  <rect x="36" y="30" width="1528" height="660" rx="22" fill="#050b13" fill-opacity="0.34" stroke="#183044" stroke-opacity="0.62"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="70" fill="#ffffff" font-size="31" font-weight="700">Memora, weekly track: recall after the forgetting penalty (FAMA, higher is better)</text>
    <g fill="#aebccc" font-size="20" aria-label="Published agents from the paper&apos;s Table 3 (paper&apos;s judge) · Sno Station from one formal run, 2026-09-06 (our judge, paper&apos;s penalty formula) · directional comparison">
      <text x="60" y="108">Published agents from the paper&apos;s Table 3 (paper&apos;s judge) ·</text>
      <text x="60" y="136">Sno Station from one formal run, 2026-09-06 (our judge, paper&apos;s penalty formula) · directional comparison</text>
    </g>

    <text x="1530" y="176" text-anchor="end" fill="#93a4b7" font-size="17" font-weight="700" letter-spacing="0.65">POINTS LOST TO STALE FACTS (lower is better)</text>

    <g stroke="#2b4153" stroke-width="1">
      <line x1="250" y1="188" x2="250" y2="652"/>
      <line x1="660" y1="188" x2="660" y2="652" stroke-dasharray="4 9"/>
      <line x1="1070" y1="188" x2="1070" y2="652" stroke-dasharray="4 9"/>
    </g>
    <rect x="1128" y="190" width="412" height="448" rx="16" fill="#07121e" fill-opacity="0.56"/>

    <g class="chart-row" data-name="Sno Station" data-fama="87.2" data-cost="3.76" data-rate="4.1%" data-note="of recall" transform="translate(0,220)" aria-label="forgetting cost 3.76 pts · 4.1% of recall">
      <text x="60" y="9" fill="#ffffff" font-size="29" font-weight="700">Sno Station</text>
      <rect x="250" y="-18" width="715.04" height="30" rx="5" fill="#2dd4bf"/>
      <text x="981" y="9" fill="#ffffff" font-size="29" font-weight="700">87.2</text>
      <text x="1152" y="9" fill="#aebccc" font-size="24">3.76 pts (4.1% of recall)</text>
    </g>
    <g class="chart-row" data-name="LangMem" data-fama="50.0" data-cost="7.70" data-rate="13.3%" data-note="" transform="translate(0,286)">
      <text x="60" y="9" fill="#ffffff" font-size="29">LangMem</text>
      <rect x="250" y="-18" width="410" height="30" rx="5" fill="#536275"/>
      <text x="676" y="9" fill="#ffffff" font-size="29">50.0</text>
      <text x="1152" y="9" fill="#9eacbd" font-size="28">7.70 pts · 13.3%</text>
    </g>
    <g class="chart-row" data-name="Nemori" data-fama="45.5" data-cost="7.60" data-rate="14.3%" data-note="" transform="translate(0,352)">
      <text x="60" y="9" fill="#ffffff" font-size="29">Nemori</text>
      <rect x="250" y="-18" width="373.1" height="30" rx="5" fill="#536275"/>
      <text x="639" y="9" fill="#ffffff" font-size="29">45.5</text>
      <text x="1152" y="9" fill="#9eacbd" font-size="28">7.60 pts · 14.3%</text>
    </g>
    <g class="chart-row" data-name="MemoryOS" data-fama="45.0" data-cost="6.70" data-rate="13.0%" data-note="" transform="translate(0,418)">
      <text x="60" y="9" fill="#ffffff" font-size="29">MemoryOS</text>
      <rect x="250" y="-18" width="369" height="30" rx="5" fill="#536275"/>
      <text x="635" y="9" fill="#ffffff" font-size="29">45.0</text>
      <text x="1152" y="9" fill="#9eacbd" font-size="28">6.70 pts · 13.0%</text>
    </g>
    <g class="chart-row" data-name="MemoBase" data-fama="43.5" data-cost="8.00" data-rate="15.5%" data-note="" transform="translate(0,484)">
      <text x="60" y="9" fill="#ffffff" font-size="29">MemoBase</text>
      <rect x="250" y="-18" width="356.7" height="30" rx="5" fill="#536275"/>
      <text x="623" y="9" fill="#ffffff" font-size="29">43.5</text>
      <text x="1152" y="9" fill="#9eacbd" font-size="28">8.00 pts · 15.5%</text>
    </g>
    <g class="chart-row" data-name="A-Mem" data-fama="36.3" data-cost="3.00" data-rate="7.6%" data-note="recalls little; little to lose" transform="translate(0,550)" aria-label="3.00 pts · 7.6% (recalls little; little to lose)">
      <text x="60" y="9" fill="#ffffff" font-size="29">A-Mem</text>
      <rect x="250" y="-18" width="297.66" height="30" rx="5" fill="#536275"/>
      <text x="564" y="9" fill="#ffffff" font-size="29">36.3</text>
      <text x="1152" y="1" fill="#9eacbd" font-size="26">3.00 pts · 7.6%</text>
      <text x="1152" y="28" fill="#899aad" font-size="20">(recalls little; little to lose)</text>
    </g>
    <g class="chart-row" data-name="Mem-0" data-fama="36.3" data-cost="3.50" data-rate="8.8%" data-note="same" transform="translate(0,616)" aria-label="3.50 pts · 8.8% (same)">
      <text x="60" y="9" fill="#ffffff" font-size="29">Mem-0</text>
      <rect x="250" y="-18" width="297.66" height="30" rx="5" fill="#536275"/>
      <text x="564" y="9" fill="#ffffff" font-size="29">36.3</text>
      <text x="1152" y="9" fill="#9eacbd" font-size="26">3.50 pts · 8.8% (same)</text>
    </g>

    <g fill="#8496aa" font-size="18">
      <text x="250" y="680">0</text>
      <text x="652" y="680">50</text>
      <text x="1055" y="680">100</text>
    </g>
  </g>
</svg>
